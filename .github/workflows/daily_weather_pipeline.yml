name: Daily Weather Forecast Pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    # 19:15 UTC = 20:15 in Poland/Spain during winter time, 21:15 during summer time.
    - cron: "15 19 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_weather_pipeline.yml"
      - "configs/**"
      - "requirements.txt"
      - "src/**"
      - "docs/index.html"
      - "docs/styles.css"
      - "docs/app.js"
      - "docs/.nojekyll"

permissions:
  contents: write

concurrency:
  group: weather-data-writer
  cancel-in-progress: false

jobs:
  run-weather-pipeline:
    runs-on: ubuntu-latest

    env:
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_KEY }}
      VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
      TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest forecasts
        run: python -m src.pipelines.ingest_forecast

      - name: Ingest actual observations
        run: python -m src.pipelines.ingest_actuals

      - name: Run evaluation and update report
        run: python -m src.pipelines.run_evaluation

      - name: Sync public CSV data to GitHub Pages
        run: |
          mkdir -p docs/data
          cp reports/data/forecasts.csv docs/data/forecasts.csv
          cp reports/data/actuals.csv docs/data/actuals.csv
          cp reports/data/evaluation_detailed.csv docs/data/evaluation_detailed.csv
          cp reports/data/evaluation_mae.csv docs/data/evaluation_mae.csv

      - name: Commit generated report and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data/*.csv reports/evaluation_summary.md docs/data/*.csv
          if git diff --cached --quiet; then
            echo "No report or dashboard data changes to commit."
          else
            git commit -m "Update weather evaluation data"
            git push
          fi

      - name: Upload generated data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-pipeline-output
          path: |
            data/raw/forecasts/*.parquet
            data/raw/actuals/*.parquet
            data/processed/evaluation/*.parquet
            reports/data/*.csv
            reports/evaluation_summary.md
            docs/data/*.csv
